# VF-4-02 — CI: lint + testes unitários e de Rules (emulador). Sem deploy e sem segredos.
# Os testes E2E (tests/e2e, Playwright) NÃO rodam aqui: exigem navegador/playwright, que não é
# dependência do projeto. Rode localmente com `npm run test:e2e`.
name: CI

on:
  push:
    branches: [claude-dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Lint e testes unitários (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high # VF-SEC-09: dependências de produção sem altas/críticas
      - run: npm run lint
      - run: npm run test:unit

  rules:
    name: Security Rules no emulador (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run test:rules
      - run: npm run test:integration
